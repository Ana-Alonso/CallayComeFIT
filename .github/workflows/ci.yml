name: CI/CD Pipeline - Calla y Come Fit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: CI - Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPERMARKET_SUPABASE_URL: ${{ secrets.VITE_SUPERMARKET_SUPABASE_URL }}
          VITE_SUPERMARKET_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPERMARKET_SUPABASE_ANON_KEY }}
          VITE_SUPERMARKET_API_BASE_URL: ${{ secrets.VITE_SUPERMARKET_API_BASE_URL }}

  deploy-to-render:
    name: CD - Deploy to Render Static Site
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Lanzando despliegue automático en Render..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Petición de despliegue a Render enviada con éxito."
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL no configurado en Secrets. Render desplegará automáticamente vía webhook."
          fi
